<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Gold coin">
  <defs>
    <radialGradient id="metal" cx="34%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#fff6c8"/>
      <stop offset="28%" stop-color="#f0d56a"/>
      <stop offset="58%" stop-color="#d4af37"/>
      <stop offset="82%" stop-color="#a67c12"/>
      <stop offset="100%" stop-color="#5c4308"/>
    </radialGradient>
    <linearGradient id="rimGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#ffe9a0"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#6b4f0a"/>
    </linearGradient>
    <linearGradient id="dollarGrad" x1="35%" y1="8%" x2="65%" y2="95%">
      <stop offset="0%" stop-color="#fff8d2"/>
      <stop offset="45%" stop-color="#efd06a"/>
      <stop offset="100%" stop-color="#7a5a10"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#d4af37" flood-opacity="0.32"/>
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- outer rim -->
    <circle cx="128" cy="128" r="116" fill="url(#rimGrad)"/>

    <!-- milled edge -->
    <g stroke="#4a3606" stroke-width="5" stroke-linecap="round" opacity="0.55">
      <line x1="128" y1="14" x2="128" y2="28"/>
      <g id="ticks">
        <line x1="128" y1="14" x2="128" y2="28" transform="rotate(10 128 128)"/>
        <line x1="128" y1="14" x2="128" y2="28" transform="rotate(20 128 128)"/>
        <line x1="128" y1="14" x2="128" y2="28" transform="rotate(30 128 128)"/>
        <line x1="128" y1="14" x2="128" y2="28" transform="rotate(40 128 128)"/>
        <line x1="128" y1="14" x2="128" y2="28" transform="rotate(50 128 128)"/>
        <line x1="128" y1="14" x2="128" y2="28" transform="rotate(60 128 128)"/>
        <line x1="128" y1="14" x2="128" y2="28" transform="rotate(70 128 128)"/>
        <line x1="128" y1="14" x2="128" y2="28" transform="rotate(80 128 128)"/>
        <line x1="128" y1="14" x2="128" y2="28" transform="rotate(90 128 128)"/>
        <line x1="128" y1="14" x2="128" y2="28" transform="rotate(100 128 128)"/>
        <line x1="128" y1="14" x2="128" y2="28" transform="rotate(110 128 128)"/>
        <line x1="128" y1="14" x2="128" y2="28" transform="rotate(120 128 128)"/>
        <line x1="128" y1="14" x2="128" y2="28" transform="rotate(130 128 128)"/>
        <line x1="128" y1="14" x2="128" y2="28" transform="rotate(140 128 128)"/>
        <line x1="128" y1="14" x2="128" y2="28" transform="rotate(150 128 128)"/>
        <line x1="128" y1="14" x2="128" y2="28" transform="rotate(160 128 128)"/>
        <line x1="128" y1="14" x2="128" y2="28" transform="rotate(170 128 128)"/>
        <line x1="128" y1="14" x2="128" y2="28" transform="rotate(180 128 128)"/>
        <line x1="128" y1="14" x2="128" y2="28" transform="rotate(190 128 128)"/>
        <line x1="128" y1="14" x2="128" y2="28" transform="rotate(200 128 128)"/>
        <line x1="128" y1="14" x2="128" y2="28" transform="rotate(210 128 128)"/>
        <line x1="128" y1="14" x2="128" y2="28" transform="rotate(220 128 128)"/>
        <line x1="128" y1="14" x2="128" y2="28" transform="rotate(230 128 128)"/>
        <line x1="128" y1="14" x2="128" y2="28" transform="rotate(240 128 128)"/>
        <line x1="128" y1="14" x2="128" y2="28" transform="rotate(250 128 128)"/>
        <line x1="128" y1="14" x2="128" y2="28" transform="rotate(260 128 128)"/>
        <line x1="128" y1="14" x2="128" y2="28" transform="rotate(270 128 128)"/>
        <line x1="128" y1="14" x2="128" y2="28" transform="rotate(280 128 128)"/>
        <line x1="128" y1="14" x2="128" y2="28" transform="rotate(290 128 128)"/>
        <line x1="128" y1="14" x2="128" y2="28" transform="rotate(300 128 128)"/>
        <line x1="128" y1="14" x2="128" y2="28" transform="rotate(310 128 128)"/>
        <line x1="128" y1="14" x2="128" y2="28" transform="rotate(320 128 128)"/>
        <line x1="128" y1="14" x2="128" y2="28" transform="rotate(330 128 128)"/>
        <line x1="128" y1="14" x2="128" y2="28" transform="rotate(340 128 128)"/>
        <line x1="128" y1="14" x2="128" y2="28" transform="rotate(350 128 128)"/>
      </g>
    </g>

    <!-- coin face -->
    <circle cx="128" cy="128" r="98" fill="url(#metal)"/>
    <circle cx="128" cy="128" r="98" fill="none" stroke="#f3df8a" stroke-opacity="0.55" stroke-width="2.5"/>
    <circle cx="128" cy="128" r="84" fill="none" stroke="#6b4f0a" stroke-opacity="0.4" stroke-width="2"/>

    <!-- dollar sign -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M128 58 v140" stroke="#5c4308" stroke-width="16"/>
      <path d="M128 62 v132" stroke="url(#dollarGrad)" stroke-width="11"/>
      <path d="M168 86 c0-22-18-34-40-34 s-40 10-40 28 c0 36 80 18 80 54 0 20-18 32-40 32 s-42-12-42-34"
            stroke="#5c4308" stroke-width="16"/>
      <path d="M166 86 c0-20-16-30-38-30 s-36 9-36 26 c0 34 76 16 76 50 0 18-16 28-38 28 s-38-10-38-30"
            stroke="url(#dollarGrad)" stroke-width="11"/>
    </g>
  </g>
</svg>
